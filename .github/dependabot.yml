version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # The prefix keeps the titles in Conventional Commits, so they pass the PR title check.
    commit-message:
      prefix: build
      include: scope
    groups:
      maven:
        patterns: ["*"]
    # Maven itself changes together with the dev and CI image, in a course pull request (ADR 0001).
    ignore:
      - dependency-name: org.apache.maven:apache-maven

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
