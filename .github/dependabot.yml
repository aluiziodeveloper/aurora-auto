version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    # The prefix keeps the titles in Conventional Commits, so they pass the PR title check.
    commit-message:
      prefix: build
      include: scope
    groups:
      maven:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
