name: aurora-auto

services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        UID: ${DEV_UID:-1000}
        GID: ${DEV_GID:-1000}
    working_dir: /src
    volumes:
      - .:/src
      - m2:/home/dev/.m2
    init: true
    command: sleep infinity

volumes:
  m2:
